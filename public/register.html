
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - WanderWay</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #eef6f8;
}

header {
    background: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 2px 10px #ddd;
}

.logo {
    color: #087e8b;
    font-size: 28px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #333;
    margin: 10px;
    font-weight: bold;
}

.container {
    max-width: 480px;
    margin: 45px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #ddd;
}

h1 {
    text-align: center;
    color: #087e8b;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    background: #087e8b;
    color: white;
    font-size: 17px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #055c65;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
    color: #087e8b;
    text-decoration: none;
    font-weight: bold;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

footer {
    background: #087e8b;
    color: white;
    text-align: center;
    padding: 20px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .container {
        margin: 25px 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">WanderWay</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="packages.html">Packages</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container">

    <h1>Create Account</h1>
    <p class="subtitle">Join WanderWay and start exploring!</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="name"
        placeholder="Enter your full name" required maxlength="80">

        <label>Email Address</label>
        <input type="email" id="email"
        placeholder="Enter your email" required maxlength="120">

        <label>Phone Number</label>
        <input type="tel" id="phone"
        placeholder="Enter 10-digit phone number"
        pattern="[0-9]{10}" maxlength="10" required>

        <label>Password</label>
        <input type="password" id="password"
        placeholder="Create a password"
        minlength="8" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8" required>

        <button type="submit" id="registerBtn">
            Create Account
        </button>

        <p id="message"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

</div>

<footer>
    <p>© 2026 WanderWay | Tourist Package Management System</p>
</footer>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        message.style.color = "red";
        message.textContent = "Enter a valid 10-digit phone number.";
        return;
    }

    const button = document.getElementById("registerBtn");
    button.disabled = true;
    message.style.color = "#087e8b";
    message.textContent = "Creating your account...";

    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                email,
                phone,
                password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Registration failed.");
        }

        message.style.color = "green";
        message.textContent = "Registration successful! You can now login.";

        form.reset();

    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
